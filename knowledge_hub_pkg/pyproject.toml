[project]
name = "knowledge_hub"
version = "0.28.0"
description = "Knowledge Hub — pilot package (keep models.py in lock-step with knowledge_hub_baseline_schema.sql + migrations)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "psycopg[binary]>=3.1",
    # capture path (Build Prompt 2)
    "boto3>=1.34",
    "hvac>=2",
    # capture path, connectors: Microsoft Graph (was already transitive via
    # hvac; explicit because sources_msgraph.py imports it directly)
    "requests>=2.31",
    # processing Stage B (Build Prompt 3): parse · chunk · embed
    "docling>=2.60",
    "semchunk>=3",
    "tokenizers>=0.20",
    "ollama>=0.4",
    # resolution Stage D (Build Prompt 5): Splink 4.x bundles the DuckDB
    # backend; pandas rides in as its dependency
    "splink>=4",
]

[project.scripts]
khctl = "knowledge_hub.deploy_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_hub"]
